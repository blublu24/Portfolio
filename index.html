/* ============================================================
   Case-study overlay: #work/<slug> routing, FLIP open, focus trap, own scroller
   ============================================================ */
const caseEl = $("#case");
const caseScroller = $("#case .case-scroller");
let caseSlug = null, caseReturn = null, caseCtx = null, casePushed = false, caseLenis = null;

function wireCase(p) {
  /* Section reveals: an IntersectionObserver on the overlay's own scroller (set up once it's visible). */
  caseCtx = { io: null, boxes: [], revert() { this.io?.disconnect(); this.boxes.forEach(dropBox); this.boxes = []; } };
  /* tall screens that scroll inside their device frame get the same smooth scrolling */
  $$(".device-screen.is-scroll", caseScroller).forEach((el) => { const l = smoothBox(el); if (l) { el._lenis = l; caseCtx.boxes.push(l); } });
  if (!reduce) {
    const secs = $$(".case-sec", caseScroller);
    gsap.set(secs, { opacity: 0, y: 28 });
    caseCtx.io = new IntersectionObserver((ents) => ents.forEach((en) => {
      if (!en.isIntersecting) return;
      caseCtx.io.unobserve(en.target);
      gsap.to(en.target, { opacity: 1, y: 0, duration: .8, ease: "power3.out" });
    }), { root: caseScroller, rootMargin: "0px 0px -8% 0px" });
    requestAnimationFrame(() => secs.forEach((el) => caseCtx.io && caseCtx.io.observe(el)));
  }
  /* before/after sliders */
  $$("[data-cmp]", caseEl).forEach((inp) => {
    const box = inp.closest(".cmp");
    const set = () => { const v = +inp.value; box.style.setProperty("--pos", v + "%"); inp.setAttribute("aria-valuetext", `${v}% before, ${100 - v}% after`); };
    inp.addEventListener("input", set); set();
  });
  /* tablet viewer thumbnails */
  const viewer = $("[data-viewer]", caseEl);
  $$("[data-thumb]", caseEl).forEach((b) => b.addEventListener("click", () => {
    const s = shot(p.slug, b.dataset.thumb);
    const img = $("img", viewer);
    img.src = s.src; img.width = s.w; img.height = s.h; img.alt = s.alt;
    if (viewer._lenis) { viewer._lenis.scrollTo(0, { immediate: true }); viewer._lenis.resize(); } else viewer.scrollTop = 0;
    $("[data-viewer-cap]", caseEl).textContent = caption(p.slug, s.key);
    $$("[data-thumb]", caseEl).forEach((t) => t.setAttribute("aria-pressed", String(t === b)));
  }));
}

function renderCase(p) {
  caseCtx?.revert(); caseCtx = null;
  dropBox(caseLenis); caseLenis = null;
  caseScroller.scrollTop = 0;
  caseScroller.innerHTML = `<div class="case-content">${caseHTML(p)}</div>`;
  caseEl.setAttribute("aria-label", `Case study: ${plain(p.title)}`);
  caseLenis = smoothBox(caseScroller);
  wireCase(p);
}

function openCase(slug, { from = null, animate = true } = {}) {
  const p = projectBySlug(slug);
  if (!p) return;
  if (caseSlug) { /* already open: swap to another project (next / related links) */
    caseSlug = slug; renderCase(p);
    if (!reduce) gsap.fromTo(".case", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" });
    $(".case-close", caseEl).focus({ preventScroll: true });
    return;
  }
  caseSlug = slug;
  caseReturn = $(`[data-open-case="${slug}"]`) || document.activeElement;
  renderCase(p);
  caseEl.hidden = false;
  stopScroll();
  setInert(true);
  const srcStage = from || $(`[data-work="${slug}"] .stage`);
  const heroStage = $(".case-hero-stage .stage", caseEl);
  const r1 = srcStage && srcStage.getBoundingClientRect();
  const visible = r1 && r1.bottom > 0 && r1.top < innerHeight && r1.width > 0;
  if (reduce || !animate || !visible) {
    gsap.fromTo(caseEl, { opacity: 0 }, { opacity: 1, duration: reduce ? .25 : .4, ease: "power2.out" });
  } else {
    /* FLIP: a ghost of the tinted panel grows from the card to the hero, the devices scale uniformly with it. */
    const r2 = heroStage.getBoundingClientRect();
    const devsFrom = $(".stage-devices", srcStage).getBoundingClientRect(), devsTo = $(".stage-devices", heroStage);
    const d2 = devsTo.getBoundingClientRect();
    const ghost = document.createElement("div");
    ghost.className = "case-ghost";
    ghost.innerHTML = `<div class="stage-bg" style="${tintStyle(p)}"></div>`;
    caseEl.prepend(ghost);
    srcStage.style.visibility = "hidden";
    const bg = $(".stage-bg", heroStage);
    const k = devsFrom.width / d2.width;
    const tl = gsap.timeline({ onComplete() { ghost.remove(); gsap.set([bg, devsTo], { clearProps: "all" }); } });
    gsap.set(caseEl, { backgroundColor: "rgb(244 244 244 / 0)" });
    gsap.set(bg, { opacity: 0 });
    gsap.set(".case-bar, [data-case-fade]", { opacity: 0 });
    tl.fromTo(ghost, { left: r1.left, top: r1.top, width: r1.width, height: r1.height, borderRadius: getComputedStyle(srcStage).borderRadius },
        { left: r2.left, top: r2.top, width: r2.width, height: r2.height, borderRadius: getComputedStyle(heroStage).borderRadius, duration: .85, ease: "expo.inOut" }, 0)
      .fromTo(devsTo, { x: (devsFrom.left + devsFrom.width / 2) - (d2.left + d2.width / 2), y: (devsFrom.top + devsFrom.height / 2) - (d2.top + d2.height / 2), scale: k },
        { x: 0, y: 0, scale: 1, duration: .85, ease: "expo.inOut" }, 0)
      .to(caseEl, { backgroundColor: "rgb(244 244 244 / 1)", duration: .5, ease: "power2.out" }, .1)
      .set(bg, { opacity: 1 }, .85)
      .to(".case-bar, [data-case-fade]", { opacity: 1, duration: .5, stagger: .06, ease: "power2.out", clearProps: "opacity" }, .55)
      .add(() => { srcStage.style.visibility = ""; gsap.set(caseEl, { clearProps: "backgroundColor" }); }, .9);
  }
  $(".case-close", caseEl).focus({ preventScroll: true });
}

function closeCase() {
  if (!caseSlug) return;
  const ret = caseReturn, slug = caseSlug;
  caseSlug = null;
  setInert(false);
  startScroll();
  /* the page under a deep-linked overlay is still at the top: bring the matching row into view */
  const row = $(`[data-work="${slug}"]`);
  if (row) { const r = row.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) lenis.scrollTo(row, { immediate: true, offset: -($("#header")?.offsetHeight || 0) - 24 }); }
  gsap.to(caseEl, { opacity: 0, duration: reduce ? .2 : .35, ease: "power2.out", onComplete() {
    caseEl.hidden = true; gsap.set(caseEl, { clearProps: "opacity" });
    caseCtx?.revert(); caseCtx = null; dropBox(caseLenis); caseLenis = null; caseScroller.innerHTML = "";
    ScrollTrigger.refresh();
  } });
  const target = $(`[data-open-case="${slug}"]`) || ret;
  target?.focus({ preventScroll: true });
}

/* Router: the hash is the source of truth, so back/forward and deep links just work. */
const caseFromHash = () => { const m = location.hash.match(/^#work\/([\w-]+)$/); return m && projectBySlug(m[1]) ? m[1] : null; };
function route() {
  const slug = caseFromHash();
  if (slug) openCase(slug, { animate: !!pendingFrom, from: pendingFrom });
  else closeCase();
  pendingFrom = null;
}
let pendingFrom = null;
addEventListener("hashchange", route);
function requestClose() {
  if (casePushed && history.length > 1) { casePushed = false; history.back(); }
  else { history.replaceState(null, "", location.pathname + location.search); closeCase(); }
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='#work/']");
  if (a) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    const slug = a.getAttribute("href").slice(6);
    if (!projectBySlug(slug)) return;
    if (!caseSlug) pendingFrom = a.closest("[data-work]")?.querySelector(".stage") || null;
    if (location.hash === "#work/" + slug) { route(); return; }
    /* From the page: push one history entry (Back closes). Inside the overlay: replace it, so one Back still closes. */
    if (caseSlug) location.replace("#work/" + slug);
    else { casePushed = true; location.hash = "work/" + slug; }
    return;
  }
  if (e.target.closest("[data-case-close]")) requestClose();
});
caseEl.addEventListener("keydown", (e) => trapFocus(caseEl, e));

/* ============================================================
   Service rows, footer buttons, copy-email, back to top, links
   ============================================================ */
document.addEventListener("click", (e) => {
  const svc = e.target.closest("[data-service]");
  if (svc) {
    e.preventDefault();
    openModal(`Interested in: ${svc.dataset.service}`, svc);
    return;
  }
  const openBtn = e.target.closest("[data-open-modal]");
  if (openBtn) { openModal(null, openBtn); return; }
  const modalBtn = e.target.closest("[data-modal]");
  if (modalBtn) { e.preventDefault(); openModal(null, modalBtn); return; }
  if (e.target.closest("[data-top]")) { scrollToId("home"); return; }
  const resume = e.target.closest("[data-resume]");
  if (resume && !HAVE.resume) {
    e.preventDefault();
    live("Résumé not supplied yet.");
    info("resume.pdf not supplied yet");
  }
});

$("#copy-email")?.addEventListener("click", async () => {
  const lbl = $("#copy-email .lbl");
  try { await navigator.clipboard.writeText(CONTENT.email); } catch (err) { /* clipboard blocked: show the swap anyway */ }
  live(CONTENT.copied);
  $("#copy-live").textContent = CONTENT.copied;
  gsap.fromTo(lbl, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: .3, ease: "power3.out" });
  lbl.textContent = CONTENT.copied;
  setTimeout(() => { lbl.textContent = CONTENT.email; }, 1600);
});

/* Escape closes whichever overlay is open */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!menu.hidden) closeMenu();
  else if (!modal.hidden) closeModal();
  else if (caseSlug) requestClose();
});

/* ============================================================
   Asset checks (optional files: info only; required files: banner)
   ============================================================ */
photo.addEventListener("error", () => banner(`Required asset failed: ${PATHS.photo}`));
info("hero photo: transparent PNG cut-out, no multiply blend needed");
if (!HAVE.logos) info("client logos not supplied yet: placeholder name tiles");
if (!HAVE.avatars) info("avatars not supplied yet: placeholder tiles");

/* ============================================================
   Boot
   ============================================================ */
let heroReadyResolve;
const heroReadyP = new Promise((res) => { heroReadyResolve = res; });
const hold = setTimeout(() => heroReadyResolve(), 6000);

(async () => {
  layoutSubject();
  await photo.decode().catch(() => banner(`Required asset failed: ${PATHS.photo}`));
  if (htInit()) { hero.classList.add("has-halftone"); htResize(); }
  clearTimeout(hold);
  heroReadyResolve();
})();

let resizeT;
addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { layoutSubject(); htResize(); }, 200);
});

readyPromise.then(() => {
  gsap.to(header, { opacity: 1, y: 0, duration: .8, delay: .15, ease: "expo.out" });
  heroEntrance();
  htEntrance();
  setupReveals();
  setupParallax();
  setupHover();
  setupNavTracking();
  if (caseFromHash()) openCase(caseFromHash(), { animate: false });
});

runLoader(heroReadyP);

/* ============================================================
   Header glass: SVG lens (refraction, only when --g-refract ≠ 0)
   ============================================================ */
(function glass() {
  const shell = document.querySelector(".site-header .shell");
  if (!shell) return;
  const root = document.documentElement;
  const isChromium = (navigator.userAgentData?.brands?.some(b => b.brand === "Chromium") || /\bChrome\/\d/.test(navigator.userAgent)) && CSS.supports("backdrop-filter", "url(#x)");

  // The lens: a displacement map drawn from the pill's own shape. Near the edge, the backdrop is
  // pulled along the inward normal, so what sits behind bends like the rim of a glass rod.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("aria-hidden", "true");
  svg.style.cssText = "position:absolute;width:0;height:0;overflow:hidden";
  svg.innerHTML = `<filter id="g-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage id="g-map" x="0" y="0" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap id="g-disp" in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>`;
  document.body.append(svg);
  const feMap = svg.querySelector("#g-map"), feDisp = svg.querySelector("#g-disp");

  function drawMap() {
    const W = Math.round(shell.offsetWidth), H = Math.round(shell.offsetHeight);
    if (!W || !H) return;
    const bezel = Math.max(2, +getComputedStyle(root).getPropertyValue("--g-bezel") || 14);
    const s = .5, w = Math.ceil(W * s), h = Math.ceil(H * s);   // half res is plenty, it gets blurred anyway
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const ctx = c.getContext("2d"), img = ctx.createImageData(w, h), d = img.data;
    const r = H / 2, hx = W / 2 - r, hy = H / 2 - r;
    const sdf = (x, y) => {               // signed distance to the rounded rect, negative inside
      const qx = Math.abs(x - W / 2) - hx, qy = Math.abs(y - H / 2) - hy;
      return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
    };
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const x = (i + .5) / s, y = (j + .5) / s, dist = -sdf(x, y);
      let nx = 0, ny = 0;
      if (dist >= 0 && dist < bezel) {
        const gx = sdf(x + 1, y) - sdf(x - 1, y), gy = sdf(x, y + 1) - sdf(x, y - 1), gl = Math.hypot(gx, gy) || 1;
        const m = (1 - dist / bezel) ** 2;
        nx = gx / gl * m; ny = gy / gl * m;
      }
      const k = (j * w + i) * 4;
      d[k] = 128 + nx * 127; d[k + 1] = 128 + ny * 127; d[k + 2] = 128; d[k + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    feMap.setAttribute("width", W); feMap.setAttribute("height", H);
    feMap.setAttribute("href", c.toDataURL());
  }

  function applyRefract() {
    const amt = +getComputedStyle(root).getPropertyValue("--g-refract") || 0;
    feDisp.setAttribute("scale", amt);
    const on = isChromium && amt !== 0;
    shell.classList.toggle("is-refracting", on);
    if (on) drawMap();
  }
  let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(applyRefract, 120); }).observe(shell);
  applyRefract();
})();
</script>
