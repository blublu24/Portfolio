<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asher Blue | Product Designer &amp; Full-Stack Developer</title>
<meta name="description" content="Asher Blue is a product designer and full-stack developer who takes products from first sketch to shipped code." />
<meta name="theme-color" content="#050505" />
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "lenis": "https://unpkg.com/lenis@1.3.23/dist/lenis.mjs",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/index.js",
    "gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/ScrollTrigger.js"
  }
}
</script>
<style>
:root{
  --blue-700:#0047CC; --blue-400:#4F94F7; --ink-950:#050505; --slate-900:#222A36;
  --charcoal-700:#333333; --paper-50:#F4F4F4; --mist-100:#E6ECF5; --white:#FFFFFF;

  --background:#F4F4F4; --foreground:#050505; --ink:#050505; --ink-raised:#222A36;
  --muted:#7A818C; --subtle:#AEB4BD; --line:#DDE2EA; --line-dark:#333333;
  --surface:#FFFFFF; --surface-2:#E6ECF5; --accent:#0047CC; --accent-light:#4F94F7; --accent-deep:#0A2F80;
  --gradient-signature:linear-gradient(90deg,#222A36 0%,#222A36 6%,#14397A 22%,#0047CC 34%,
      #0A5BD9 46%,#1A78E6 58%,#3A8EF0 70%,#5A9BFA 82%,#E6ECF5 100%);
  --hero-haze:linear-gradient(180deg,#E6ECF5 0%,#F4F4F4 100%);
  --radius-pill:9999px; --container-shell:88rem;
  /* Header glass. --g-refract > 0 turns on the SVG lens at the pill's edge (Chromium only). */
  --g-blur:13px; --g-sat:300%; --g-bright:103%;
  --g-tint:.41; --g-tint-fixed:.17; --g-chip:.71;
  --g-edge:.07; --g-hi:.75; --g-shadow:.14;
  --g-refract:0; --g-bezel:14;
  --font-display:"Archivo",sans-serif;
  --font-sans:"Onest",sans-serif;
}
@media (max-width:1920px){ html{ font-size:0.833333vw } }
@media (max-width:1440px){ html{ font-size:1.111111vw } }
@media (max-width:1024px){ html{ font-size:1.5625vw } }
@media (max-width:640px){  html{ font-size:4.444444vw } }

*{box-sizing:border-box;margin:0;padding:0}
h1,h2,h3,p,span,a,button,li{overflow-wrap:anywhere}
html{-webkit-font-smoothing:antialiased}
html.is-locked{position:relative;overflow:hidden;height:100%}
body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
ul{list-style:none} img{display:block;max-width:100%}
[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shell{max-width:var(--container-shell);margin-inline:auto;padding-inline:1.25rem}
@media (min-width:640px){.shell{padding-inline:2rem}}
.skip{position:fixed;left:1rem;top:1rem;z-index:200;transform:translateY(-200%);background:var(--ink);color:#fff;padding:.75rem 1.25rem;border-radius:9999px;transition:transform .2s}
.skip:focus{transform:none}
.icon{width:1em;height:1em;flex:none}

.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:500;color:rgb(5 5 5/.7)}
.eyebrow::before{content:"";width:.375rem;height:.375rem;border-radius:50%;background:var(--accent);opacity:.5}
.eyebrow.light{color:rgb(255 255 255/.7)}
.eyebrow.light::before{background:#fff;opacity:.6}
.pill-label{display:inline-flex;align-items:center;border:1px solid var(--accent);border-radius:9999px;padding:.375rem 1rem;font-size:.8125rem;font-weight:600;color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:.75rem;border-radius:9999px;font-size:.875rem;font-weight:500;transition:background-color .25s,color .25s,border-color .25s;will-change:transform}
.pill--arrow{padding:.375rem .375rem .375rem 1.5rem}
.pill--plain{padding:.875rem 1.75rem}
.pill--dark{background:var(--ink);color:#fff}
.pill--accent{background:var(--accent);color:#fff}
.pill--light{background:var(--surface);color:var(--ink)}
.pill--outline{border:1px solid var(--line);color:var(--ink);background:transparent}
.pill--outline:hover{border-color:var(--ink)}
.pill .badge{width:2.25rem;height:2.25rem;border-radius:50%;display:grid;place-items:center;flex:none}
.pill--accent .badge{background:#fff;color:var(--accent)}
.pill--outline .badge,.pill--light .badge{background:var(--ink);color:#fff}
.pill .badge .icon{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.pill:hover .badge .arr{transform:translateX(3px)}
.pill:hover .badge .arr-up{transform:translate(2px,-2px)}

.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:.5rem;padding:.5rem 1rem;font-size:.875rem;color:var(--ink);transition:border-color .2s,color .2s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip--light{border-color:rgb(255 255 255/.25);color:#fff}

/* Loader */
#loader{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;background:var(--ink);color:#fff;border-radius:0 0 2rem 2rem}
.loader-center{display:flex;flex-direction:column;align-items:center;gap:1.25rem;text-align:center}
.loader-brand{display:flex;align-items:center;gap:.75rem;font-weight:600;font-size:1.5rem;color:#fff}
.loader-brand .icon{width:1.875rem;height:1.875rem;color:var(--accent-light)}
@media (min-width:640px){.loader-brand{font-size:1.875rem}}
.loader-tag{max-width:24ch;font-size:.875rem;color:rgb(255 255 255/.55)}
.loader-progress{width:min(22rem,72vw);display:flex;flex-direction:column;gap:.75rem}
.loader-track{height:1px;background:rgb(255 255 255/.15);position:relative;overflow:hidden}
.loader-fill{position:absolute;inset:0;background:var(--accent-light);transform-origin:left;transform:scaleX(0)}
.loader-meta{display:flex;justify-content:space-between;font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:rgb(255 255 255/.45)}
.loader-count{font-variant-numeric:tabular-nums;color:rgb(255 255 255/.8)}

/* Header */
.site-header{position:fixed;inset-inline:0;top:0;z-index:50;padding:.75rem .75rem 0;pointer-events:none}
@media (min-width:640px){.site-header{padding:1rem 1.25rem 0}}
/* Floating glass pill. The chips inside are pills too, so the curves stay concentric.
   Every value comes from the --g-* tokens on :root. Refraction (Chromium only) swaps in an SVG lens filter via .is-refracting. */
.site-header .shell{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
  max-width:var(--container-shell);margin-inline:auto;min-height:4rem;padding:.5rem .5rem .5rem 1.5rem;border-radius:9999px;
  border:1px solid transparent;background:rgb(255 255 255/var(--g-tint));
  -webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat)) brightness(var(--g-bright));
  backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat)) brightness(var(--g-bright));
  box-shadow:inset 0 1px 0 rgb(255 255 255/var(--g-hi)),0 0 0 1px rgb(5 5 5/var(--g-edge)),0 1px 2px rgb(5 5 5/calc(var(--g-shadow) * .3)),0 12px 32px -12px rgb(5 5 5/var(--g-shadow));
  transition:background-color .3s ease-out,box-shadow .3s ease-out}
.site-header .shell.is-refracting{backdrop-filter:url(#g-refract) blur(var(--g-blur)) saturate(var(--g-sat)) brightness(var(--g-bright))}
@media (min-width:640px){.site-header .shell{min-height:4.5rem;padding-inline-start:2rem}}
.site-header .chip-box{border-radius:9999px;border-color:rgb(221 226 234/.8);background:rgb(255 255 255/var(--g-chip))}
.site-header .hire-chip{background:var(--accent);border-color:var(--accent)}
/* Past the hero: a little more opaque so it holds up over darker sections. */
.site-header.is-fixed .shell{background:rgb(255 255 255/var(--g-tint-fixed))}
/* Over dark blocks (see DARK_UNDER_HEADER): white text, lighter accent so the active link keeps its contrast. Chips keep their own tint. */
.site-header .brand,.site-header .nav-links a{transition:color .3s ease-out,opacity .2s ease-out}
.site-header.on-dark .brand,.site-header.on-dark .nav-links a{color:#fff}
.site-header.on-dark .brand .icon,.site-header.on-dark .nav-links a[aria-current="true"]{color:var(--accent-light)}
.site-header.on-dark .nav-links a::after{background:var(--accent-light)}
.site-header.on-dark .shell{box-shadow:inset 0 1px 0 rgb(255 255 255/calc(var(--g-hi) * .35)),0 0 0 1px rgb(255 255 255/.12),0 12px 32px -12px rgb(5 5 5/var(--g-shadow))}
.brand{display:flex;align-items:center;gap:.625rem;font-size:1.375rem;font-weight:800;letter-spacing:-.01em}
.brand .icon{color:var(--accent);width:1.75rem;height:1.75rem}
.nav-links{display:none;gap:2.75rem;font-size:1.125rem;font-weight:500}
@media (min-width:1024px){.nav-links{display:flex}}
.nav-links a{position:relative;display:inline-block;padding-block:.5rem;transition:opacity .2s ease-out}
.nav-links a:not(:hover){opacity:.8}
.nav-links a::after{content:"";position:absolute;left:50%;bottom:-.125rem;translate:-50% 0;width:5px;height:3px;border-radius:9999px;background:var(--accent);opacity:0;transition:width .4s cubic-bezier(.2,.8,.2,1),opacity .25s}
.nav-links a[aria-current="true"]{color:var(--accent);opacity:1}
.nav-links a[aria-current="true"]::after{width:100%;opacity:1}
.menu-item[aria-current="true"] .label{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.nav-links a::after{transition:none}}
@media (hover:hover){
  .nav-links a:hover{opacity:1}
  .chip-box.is-btn:hover{background:var(--surface-2)}
}
.header-right{display:flex;align-items:center;gap:.5rem}
.chip-box{display:flex;align-items:center;gap:.5rem;min-height:3rem;border:1px solid var(--line);background:var(--background);border-radius:.875rem;padding:.625rem 1rem;font-size:.875rem;transition:background-color .2s ease-out}
@media (min-width:640px){.chip-box{min-height:3.5rem;padding-inline:1.25rem}}
.chip-box.is-btn:not(:disabled):active{scale:.96;transition:background-color .2s ease-out,scale .15s ease-out}
.chip-box .muted{color:var(--muted)}
.clock-chip{display:none}
@media (min-width:768px){.clock-chip{display:flex}}
.hire-chip{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;white-space:nowrap}
/* Phones: brand + Hire me + Menu must share one row. Tighten spacing; under 360px the menu's own CTA takes over. */
@media (max-width:639px){.site-header .shell{gap:.75rem;padding-inline-start:1.25rem}.site-header .brand{white-space:nowrap;font-size:1.125rem;gap:.5rem}.site-header .brand .icon{width:1.5rem;height:1.5rem}.hire-chip{padding-inline:.875rem}}
@media (max-width:379px){.hire-chip{display:none}}
/* 1024-1279: nav links + Hire me + Menu fill the bar, so the clock steps out until there's room. */
@media (min-width:1024px) and (max-width:1279px){.clock-chip{display:none}}
.nav-links a,.menu-chip,.brand{white-space:nowrap}
@media (hover:hover){.site-header .hire-chip.is-btn:hover{background:var(--accent-deep);border-color:var(--accent-deep)}}
.menu-chip .label{display:none}
@media (min-width:640px){.menu-chip .label{display:inline}}

/* Hero */
#home{position:relative;isolation:isolate;overflow:hidden;border-radius:0 0 2rem 2rem;background:var(--hero-haze);min-height:100vh;min-height:100lvh}
.liquid{position:absolute;inset:0;z-index:0;pointer-events:none}
.subject{position:absolute;overflow:hidden}
.subject-inner{position:absolute;inset:0;will-change:transform}
.subject-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.haze{position:absolute;inset:-40px;z-index:0;pointer-events:none;background:var(--hero-haze)}
/* Halftone mode (WebGL2 ok): the dots canvas draws you; the colour photo stays in the DOM for its alt text only. */
.halftone{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;display:none}
#home.has-halftone .halftone{display:block}
#home.has-halftone .subject-photo{opacity:0}
.legibility{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to right,rgb(244 244 244/.85) 0%,rgb(244 244 244/.35) 45%,transparent 65%)}
.watermark{position:absolute;inset-inline:0;bottom:7rem;z-index:0;text-align:center;pointer-events:none;user-select:none;font-family:var(--font-display);font-stretch:125%;font-weight:800;line-height:1;font-size:min(13rem,17vw);color:rgb(255 255 255/.4);opacity:0;white-space:nowrap}
/* Hero layout: the text block sits vertically centred on the leading side; the focus card anchors the
   bottom of the trailing side, over the portrait. Top padding clears the fixed glass header. */
.hero-content{position:relative;z-index:20;display:flex;flex-direction:column;gap:2.5rem;padding:7.5rem 1.25rem 4rem;min-height:calc(100lvh - 4.25rem)}
@media (min-width:640px){.hero-content{padding:8.5rem 2rem 4rem}}
@media (min-width:1024px){.hero-content{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:center;column-gap:2.5rem;padding:8rem 2rem 2.5rem}}
.hero-left{display:flex;flex-direction:column;align-items:flex-start;gap:1.5rem}
@media (min-width:1024px){.hero-left{grid-column:1 / span 8;grid-row:1}}
.hero-right{display:flex;flex-direction:column;align-items:flex-end}
@media (min-width:1024px){.hero-right{grid-column:9 / span 4;grid-row:1;align-self:end}}
/* Sized so the longest line ("THAT SHIPS.", ≈7.9em wide) fills but never exceeds its column.
   rem is fluid here (see the html font-size rules), so each step is tied to that range's column width. */
.hero-h1{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:2.5rem;line-height:.98;letter-spacing:-.02em;text-transform:uppercase}
@media (min-width:640px){.hero-h1{font-size:2.3rem}} /* exactly 640: phone rem + wider padding */
@media (min-width:641px){.hero-h1{font-size:7.3rem}}
@media (min-width:1024px){.hero-h1{font-size:4.7rem}}
@media (min-width:1025px){.hero-h1{font-size:6.5rem}}
.hero-tags{display:flex;flex-wrap:wrap;gap:.625rem;list-style:none;margin:.5rem 0 0;padding:0}
.hero-tags .chip{border-color:var(--accent);color:var(--accent);background:rgb(255 255 255/.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:.5rem;font-size:.9375rem;font-weight:600;padding:.5rem .9375rem}
@media (min-width:641px){.hero-tags .chip{font-size:1.0625rem;padding:.625rem 1.125rem}}
.hero-ctas{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.5rem}
.intro-body{font-size:1.125rem;line-height:1.55;color:rgb(5 5 5/.72);max-width:36rem;text-wrap:pretty}
.hero-left .eyebrow{margin-bottom:-.25rem}
/* Phones run a large fluid rem (≈17px at 390), so the bigger supporting text starts at tablet width. */
@media (min-width:641px){
  .intro-body{font-size:1.3125rem;line-height:1.5}
  .hero-left .eyebrow{font-size:1.0625rem}
  .hero-ctas .pill{font-size:1.0625rem}
  .hero-ctas .pill--arrow{padding:.4375rem .4375rem .4375rem 1.75rem}
  .hero-ctas .pill .badge{width:2.75rem;height:2.75rem}
}
.hero-card{position:relative;display:flex;gap:.5rem;padding:.5rem;max-width:24rem;width:100%;background:rgb(255 255 255/.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:1.25rem;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
@media (min-width:1024px){.hero-card{max-width:19rem}}
.hero-card-tile{width:6rem;height:6rem;flex:none;border-radius:1rem;background:var(--ink);display:grid;place-items:center;color:var(--accent-light)}
.hero-card-tile .icon{width:2.5rem;height:2.5rem}
.hero-card-body{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:.25rem .25rem .25rem .5rem;min-width:0}
.caption{font-size:.75rem;color:var(--muted)}
.card-title-sm{font-size:.875rem;font-weight:500;margin-top:.25rem}
.hero-card-controls{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem}
.dots{display:flex;align-items:center;gap:.375rem}
.dot-btn{padding:.5rem 0}
.dot{display:block;width:.375rem;height:.375rem;border-radius:9999px;background:var(--line);transition:width .35s,background-color .35s}
.dot.is-active{width:1rem;background:var(--accent)}
.arrow-btns{display:flex;gap:.25rem}
.arrow-btn{width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.arrow-btn .icon{width:.875rem;height:.875rem}
.arrow-btn.prev .icon{transform:scaleX(-1)}
.rating{display:flex;align-items:center;gap:.5rem;font-size:.8125rem;color:rgb(5 5 5/.7);margin-top:1rem}
.stars{display:flex;gap:.125rem;color:var(--accent)}
.stars .icon{width:.875rem;height:.875rem}
.hero-status{position:relative;z-index:20;border-top:1px solid rgb(5 5 5/.1);margin:0 1.25rem;padding:1.25rem 0;display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.875rem;color:rgb(5 5 5/.6);opacity:0}
@media (min-width:640px){.hero-status{margin:0 2rem}}
/* Phones: keep location + availability (what a recruiter needs), drop the scroll cue; wrap to two rows rather than mid-phrase. */
@media (max-width:639px){.hero-status{flex-wrap:wrap;row-gap:.375rem}.hero-status>span{white-space:nowrap}.hero-status .scroll-cue{display:none}}
.scroll-cue{display:inline-flex;gap:.5rem;align-items:center}
#scroll-arrow{display:inline-block}

/* Sections */
section{position:relative}
.proof{background:var(--background);padding-block:5rem}
@media (min-width:1024px){.proof{padding-block:7rem}}
.proof-top{display:flex;flex-direction:column;gap:2rem;justify-content:space-between;padding-bottom:2rem;border-bottom:1px solid var(--line)}
@media (min-width:768px){.proof-top{flex-direction:row;align-items:flex-end}}
.h2{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:2.25rem;line-height:.98;text-transform:uppercase;letter-spacing:-.02em;margin-top:1rem}
@media (min-width:640px){.h2{font-size:3rem}}
.lines .line{display:block;overflow:hidden}
.lines .inner{display:block}
.rating-block{display:flex;align-items:center;gap:.75rem;font-size:.875rem;color:var(--muted)}
/* Lines come from each cell's shadow (not the grid background), so an unfilled last row reads as empty cells, not a grey block. */
.logo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--background);margin-top:3rem;border:1px solid var(--line)}
@media (min-width:640px){.logo-grid{grid-template-columns:repeat(3,1fr)}}
/* 9 tools: 3 columns from tablet up (3x3, flatter cells on desktop); on phones an odd last cell spans the row. */
@media (min-width:1024px){.logo-grid .logo-cell{aspect-ratio:3/1}}
.logo-cell{background:var(--background);box-shadow:1px 0 0 var(--line),0 1px 0 var(--line);aspect-ratio:2/1;display:grid;place-items:center;transition:background-color .3s}
.logo-cell:hover{background:var(--surface)}
@media (max-width:639px){.logo-cell:last-child:nth-child(odd){grid-column:span 2;aspect-ratio:4/1}}
.logo-inner{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.875rem;color:var(--ink);opacity:.7;transition:opacity .3s}
.logo-inner{gap:.75rem;font-size:1rem}
.logo-inner .icon{width:1.5rem;height:1.5rem;transition:color .3s}
@media (min-width:1024px){.logo-inner .icon{width:1.75rem;height:1.75rem}}
@media (hover:hover){.logo-cell:hover .tool-icon{color:var(--brand)}}
.logo-cell:hover .logo-inner{opacity:1}
.testimonial{margin-top:3rem;border-radius:2rem;background:var(--ink);color:#fff;padding:2.5rem;overflow:hidden}
@media (min-width:640px){.testimonial{padding:3.5rem}}
.quote-mark{width:2.5rem;height:2.5rem;color:var(--accent-light)}
.t-quote{font-weight:500;font-size:1.5rem;line-height:1.3;margin-top:1.25rem;max-width:34em}
@media (min-width:640px){.t-quote{font-size:1.875rem}}
.t-person{display:flex;align-items:center;gap:.75rem;margin-top:2rem}
.avatar{width:2.5rem;height:2.5rem;border-radius:50%;background:var(--ink-raised);border:1px dashed var(--line-dark);display:grid;place-items:center;font-size:.45rem;text-align:center;color:rgb(255 255 255/.6);padding:.25rem;overflow:hidden;flex:none}
.t-name{font-size:.875rem;font-weight:600}
.t-role{font-size:.75rem;color:rgb(255 255 255/.55)}
.t-ctrl{display:flex;align-items:center;justify-content:flex-end;gap:.75rem;margin-top:1.5rem}
.ctl-btn{width:2.25rem;height:2.25rem;border-radius:50%;border:1px solid rgb(255 255 255/.2);display:grid;place-items:center;color:#fff}
.ctl-btn .icon{width:.875rem;height:.875rem}
.ctl-btn.prev .icon{transform:scaleX(-1)}
.dots--light .dot{background:rgb(255 255 255/.25)}
.dots--light .dot.is-active{background:var(--accent-light)}

.works{background:var(--background);padding:2.5rem 0 5rem}
@media (min-width:1024px){.works{padding-bottom:7rem}}
.works-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1rem}

/* Stage: tinted backdrop panel per project (--t-base, --t-a, --t-b come from the project's brand). */

  background-image:linear-gradient(rgb(5 5 5/.05) 1px,transparent 1px),linear-gradient(90deg,rgb(5 5 5/.05) 1px,transparent 1px);background-size:2.5rem 2.5rem;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000,transparent 80%);mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000,transparent 80%)}

/* Device frames, pure CSS. cqw units keep bezels, radii and the island proportional at any size. */
.device{position:relative;container-type:inline-size;flex:none}
/* .device is the size container; .device-body draws the frame, so every cqw value scales with the device. The bezel is padding and the screen keeps the design's own aspect ratio (--ar, set per image), so screens fit exactly. */
.device-screen{position:relative;width:100%;overflow:hidden;background:#fff}
.device-screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}

.device-body{position:relative}
.device--phone .device-body{padding:3.2cqw;border-radius:13.5cqw;background:#121418;
  box-shadow:inset 0 0 0 .55cqw #3A3F48,inset 0 0 0 1.1cqw #121418,0 1px 2px rgb(5 5 5/.18),0 2.5rem 4rem -1.5rem rgb(10 47 128/.38)}
.device--phone .device-screen{aspect-ratio:var(--ar,402 / 874);border-radius:10.5cqw}
.device--phone::before{content:"";position:absolute;right:-.7cqw;top:24%;width:.9cqw;height:13%;border-radius:0 .6cqw .6cqw 0;background:#2A2E35}
.device--tablet .device-body{padding:2.6cqw;border-radius:4.2cqw;background:#121418;
  box-shadow:inset 0 0 0 .3cqw #3A3F48,0 1px 2px rgb(5 5 5/.18),0 2.5rem 4rem -1.75rem rgb(10 47 128/.4)}
.device--tablet .device-screen{aspect-ratio:var(--ar,1280 / 800);border-radius:1.4cqw}

.device--browser .device-body{border-radius:1.6cqw;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px rgb(5 5 5/.08),0 1px 2px rgb(5 5 5/.08),0 2.5rem 4rem -1.75rem rgb(10 47 128/.36)}

  .structure.is-wide .structure-legend > :not(ol){grid-column:1 / span 4}.structure.is-wide .legend-list{grid-column:5 / span 8;grid-row:1 / span 2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem 2rem}}

@media (max-width:639px){.gb-leaf{font-size:0;padding:0}.gb-leaf .gb-n{font-size:.5625rem}.structure-art{padding:1.25rem .75rem;gap:.75rem}.gb.is-phone,.structure-art .ref{width:44%}.gb.is-tablet,.structure-art .ref.is-wide{width:100%}.structure-art.is-wide{flex-direction:column;align-items:center}}

   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
const readyPromise = new Promise((res) => window.addEventListener("ready", res, { once: true }));
const live = (msg) => { $("#live").textContent = msg; };

function banner(msg) {
  if (!(location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname))) return;
  let b = $("#banner");
  if (!b) { b = document.createElement("div"); b.id = "banner"; document.body.prepend(b); }
  b.textContent = b.textContent ? b.textContent + " · " + msg : msg;
}
const info = (msg) => console.info("[portfolio] " + msg);

/* Word and line markup. Animated spans are aria-hidden; the plain copy goes in a sr-only sibling. */
function wordSpans(text) {
  return text.split(" ").map(w => `<span class="w" style="display:inline-block">${esc(w)}</span>`).join(" ");
}
function lineSpans(lines) {
  return lines.map(l => `<span class="line" style="display:block;overflow:hidden"><span class="inner" style="display:block">${esc(l)}</span></span>`).join("");
}

/* ============================================================
   Scroll engine: Lenis driven by GSAP's ticker (one loop)
   ============================================================ */
const { gsap } = await import("gsap");
const { ScrollTrigger } = await import("gsap/ScrollTrigger");
const Lenis = (await import("lenis")).default;
gsap.registerPlugin(ScrollTrigger);
history.scrollRestoration = "manual";
window.scrollTo(0, 0);

const lenis = new Lenis({ smoothWheel: !reduce });
lenis.on("scroll", ScrollTrigger.update);
gsap.ticker.add((t) => lenis.raf(t * 1000));
gsap.ticker.lagSmoothing(0);

const easeOut4 = (t) => 1 - Math.pow(1 - t, 4);
/* Nested smooth scrollers (case-study overlay, scrollable device screens, contact form).
   Each box keeps data-lenis-prevent so the page's Lenis ignores it; Lenis skips that attribute on its own wrapper,
   so the box's own instance still runs. All of them tick on GSAP's ticker, like the page. */
const subLenis = new Set();
function smoothBox(wrapper, content = wrapper && wrapper.firstElementChild) {
  if (!wrapper || !content) return null;
  const l = new Lenis({ wrapper, content, smoothWheel: !reduce, overscroll: false });
  subLenis.add(l);
  return l;
}
function dropBox(l) { if (!l) return; subLenis.delete(l); l.destroy(); }
gsap.ticker.add((t) => subLenis.forEach((l) => l.raf(t * 1000)));
function stopScroll() { lenis.stop(); document.documentElement.classList.add("is-locked"); }
function startScroll() { lenis.start(); document.documentElement.classList.remove("is-locked"); }
function scrollToId(id) {
  if (id === "home") lenis.scrollTo(0, { duration: 1.4, easing: easeOut4 });
  else lenis.scrollTo("#" + id, { duration: 1.4, easing: easeOut4, offset: -($("#header")?.offsetHeight || 0) });
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='#']");
  if (!a || a.closest("#nav-menu") || a.dataset.modal || a.dataset.service) return;
  const id = a.getAttribute("href").slice(1);
  if (!id || (!document.getElementById(id) && id !== "home")) return;
  e.preventDefault();
  scrollToId(id);
});

/* Adaptive rem grid (Lumora verbatim) */
function applyAdaptiveGrid() {
  const FONT_BASE = 16, baseWidth = 1920, coef = 0.6666, w = innerWidth;
  const widthReduction = ((baseWidth - w) / baseWidth) * 100;
  const size = FONT_BASE - (FONT_BASE * (widthReduction * coef)) / 100;
  if (size > FONT_BASE) document.documentElement.style.fontSize = size + "px";
  else document.documentElement.style.removeProperty("font-size");
}
applyAdaptiveGrid();
let rzTimer;
addEventListener("resize", () => {
  applyAdaptiveGrid();
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => ScrollTrigger.refresh(), 150);
});

function manilaTime(d = new Date()) {
  const tp = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Manila", hour: "numeric", minute: "2-digit", hour12: true }).formatToParts(d);
  const dp = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Manila", day: "numeric", month: "long", year: "numeric" }).formatToParts(d);
  const g = (arr, t) => (arr.find(p => p.type === t) || {}).value || "";
  return {
    time: `${g(tp, "hour")}:${g(tp, "minute")}${g(tp, "dayPeriod").toLowerCase()}`,
    date: `${g(dp, "day")} ${g(dp, "month")}, ${g(dp, "year")}`
  };
}
function tickClock() {
  const t = manilaTime();
  $("#clock-time").textContent = t.time;
  $("#clock-date").textContent = t.date;
  $$("[data-clock]").forEach(el => { el.textContent = t.time; });
}

setInterval(tickClock, 1000);

const header = $("#header");
gsap.set(header, { opacity: 0, y: -14 });
function setHeaderFixed(fixed) {
  header.classList.toggle("is-fixed", fixed);
}
/* The header is always fixed (sticky glass bar); is-fixed only strengthens the glass once the hero has slid under it. */
const headerShell = $("#header .shell");
/* Over a dark block the glass is near clear, so the header's own text turns white while its middle line sits on one. */
const DARK_UNDER_HEADER = ".testimonial, .stats-panel, .site-footer";
function syncHeaderGlass() {
  const home = $("#home");
  const bar = headerShell.getBoundingClientRect();
  if (home) setHeaderFixed(home.getBoundingClientRect().bottom <= bar.bottom);
  const mid = bar.top + bar.height / 2;
  const onDark = $$(DARK_UNDER_HEADER).some(el => {
    const r = el.getBoundingClientRect();
    return r.top <= mid && r.bottom >= mid && r.left < bar.right && r.right > bar.left;
  });
  header.classList.toggle("on-dark", onDark);
}
lenis.on("scroll", syncHeaderGlass);
addEventListener("resize", syncHeaderGlass);

/* ============================================================

const PROJECTS = CONTENT.projects;
const projectBySlug = (slug) => PROJECTS.find((p) => p.slug === slug);
/* Escape, then turn [[DRAFT: …]] / [[PLACEHOLDER: …]] into visible marks (the brackets stay, so Ctrl-F still finds them). */
const mark = (s) => esc(s).replace(/\[\[(DRAFT|PLACEHOLDER):([\s\S]*?)\]\]/g, (_, k, body) =>
  `<mark class="${k === "DRAFT" ? "draft" : "ph"}">[[${k}:${body}]]</mark>`);
const plain = (s) => String(s).replace(/\[\[(?:DRAFT|PLACEHOLDER):\s*([\s\S]*?)\]\]/g, "$1");
function shot(slug, key) {
  const m = WORKS_MEDIA[slug], s = m && m.screens[key];
  if (!s) return null;
  return { src: `${ASSET_BASE}/works/${m.dir}/${key}.webp`, w: s[0], h: s[1], alt: s[2], key };
}
const caption = (slug, key) => (WORKS_CAPTIONS[slug] || {})[key] || "";
const imgTag = (s, { lazy = true, alt } = {}) =>
  `<img src="${s.src}" width="${s.w}" height="${s.h}" alt="${esc(alt ?? s.alt)}"${lazy ? ' loading="lazy"' : ""} decoding="async">`;
const SCREEN_ASPECT = { phone: 874 / 402, tablet: 800 / 1280, browser: 900 / 1440 };
const ICON_LOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;

/* One device frame. scroll: tall screens get a keyboard-focusable inner viewport. decorative: alt="" (the row has its own text). */
function device(kind, p, key, { scroll = false, decorative = false, slot = "", lazy = true } = {}) {
  const s = key ? shot(p.slug, key) : null;
  const tall = s && s.h / s.w > SCREEN_ASPECT[kind] * 1.12;
  const canScroll = scroll && tall;
  const label = s ? (caption(p.slug, key) || plain(p.title)) : "";
  const screen = s
    ? `<div class="device-screen${canScroll ? " is-scroll" : ""}"${tall ? "" : ` style="--ar:${s.w} / ${s.h}"`}${canScroll ? ` tabindex="0" role="region" aria-label="${esc(label)}: scrollable screen" data-lenis-prevent` : ""}>${imgTag(s, { lazy, alt: decorative ? "" : undefined })}</div>`
    : `<div class="device-screen"><div class="soon">Screens coming soon</div></div>`;
  const slotAttr = slot ? ` data-slot="${slot}"` : "";
  if (kind === "browser") return `<div class="device device--browser"${slotAttr}><div class="device-body">
      <div class="browser-bar" aria-hidden="true"><span class="browser-dots"><i></i><i></i><i></i></span><span class="browser-url">${ICON_LOCK}${esc(p.url || "")}</span><span class="browser-spacer"></span></div>
      ${screen}</div></div>`;
  return `<div class="device device--${kind}"${slotAttr}><div class="device-body">${screen}</div></div>`;
}
/* The tinted panel + mockup composition used by the row and by the overlay hero. */
function stage(p, { lazy = true } = {}) {
  const keys = p.cover.length ? p.cover : [null];
  const slots = p.device === "phone" ? ["c", "l", "r"] : [""];
  const devs = keys.slice(0, slots.length).map((k, i) => device(p.device, p, k, { decorative: true, slot: slots[i], lazy })).reverse().join("");
  const missing = keys.some((k) => !k || !shot(p.slug, k));
  return `<div class="stage stage--${p.device}" style="--t-base:${p.tint.base};--t-a:${p.tint.a};--t-b:${p.tint.b}">
    <div class="stage-bg"></div>
    <div class="stage-devices">${devs}</div>
    ${missing ? `<span class="stage-soon"><span class="soon-chip">Screens coming soon</span></span>` : ""}
  </div>`;
}
const tintStyle = (p) => `--t-base:${p.tint.base};--t-a:${p.tint.a};--t-b:${p.tint.b}`;

      <circle cx="${x + (vertical ? 23 : 27)}" cy="${y0 + (vertical ? NH / 2 : 24)}" r="11" fill="#0047CC"/><text x="${x + (vertical ? 23 : 27)}" y="${y0 + (vertical ? NH / 2 : 24) + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${k}</text>
      <text x="${x + (vertical ? 46 : 16)}" y="${ty}" font-size="14" font-weight="600" fill="#050505">${esc(st.t)}</text>
      ${subs.map((t, j) => `<text x="${x + (vertical ? 46 : 16)}" y="${ty + 17 + j * 14}" font-size="12" fill="#7A818C">${esc(t)}</text>`).join("")}</g>`;
  };
  const arrow = (x1, y1, x2, y2) => `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="#0047CC" stroke-width="2" fill="none" marker-end="url(#${mid})"/>`;
  lanes.forEach((lane, li) => {
    if (lane.label) {
      if (vertical) { parts.push(`<text x="0" y="${y + 14}" font-size="12" font-weight="700" fill="#0047CC" letter-spacing=".08em">${esc(lane.label.toUpperCase())}</text>`); y += 28; }
      else parts.push(`<text x="0" y="${y + NH / 2 + 4}" font-size="12" font-weight="700" fill="#0047CC" letter-spacing=".08em">${esc(lane.label.toUpperCase())}</text>`);
    }
    lane.steps.forEach((st, si) => {
      n++;
      const col = si % perRow, row = Math.floor(si / perRow);
      const x = LW + col * (NW + GX), y0 = y + row * (NH + GY);
      parts.push(node(x, y0, st, n));
      width = Math.max(width, x + NW);
      const next = lane.steps[si + 1];
      if (!next) return;
      if (vertical) parts.push(arrow(x + NW / 2, y0 + NH + 4, x + NW / 2, y0 + NH + GY - 6));
      else if (col < perRow - 1) parts.push(arrow(x + NW + 4, y0 + NH / 2, x + NW + GX - 6, y0 + NH / 2));
      else parts.push(`<path d="M${x + NW / 2} ${y0 + NH + 4} V${y0 + NH + GY / 2} H${LW + NW / 2} V${y0 + NH + GY - 6}" stroke="#0047CC" stroke-width="2" fill="none" marker-end="url(#${mid})"/>`);
    });
    const rows = vertical ? lane.steps.length : Math.ceil(lane.steps.length / perRow);
    y += rows * NH + (rows - 1) * GY + (li < lanes.length - 1 ? (vertical ? 34 : 30) : 0);
    if (!vertical && li < lanes.length - 1) parts.push(`<line x1="0" x2="${LW + perRow * NW + (perRow - 1) * GX}" y1="${y - 15}" y2="${y - 15}" stroke="#DDE2EA" stroke-dasharray="4 6"/>`);
  });
  const H = y + 8;
  return `<svg class="${vertical ? "flow-v" : "flow-h"}" viewBox="-2 0 ${width + 4} ${H}" role="img" aria-label="${esc(title)}" font-family="Onest, sans-serif">
    <defs><marker id="${mid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0047CC"/></marker></defs>
    ${parts.join("")}</svg>`;
}
function flowText(flow) {
  return `<ol class="sr-only">${flow.lanes.map((l) => l.steps.map((s) => `<li>${l.label ? esc(l.label) + ": " : ""}${esc(s.t)}${s.s ? ` (${esc(s.s)})` : ""}</li>`).join("")).join("")}</ol>`;
}

/* ---------- Structure: grey-box from a nested spec ---------- */
function gbNode(node, top) {
  if (node.children) {
    return `<div class="gb-node ${node.dir === "col" ? "col" : "row"}" style="flex:${node.size || 1} 1 0">${node.children.map((c) => gbNode(c)).join("")}</div>`;
  }
  return `<div class="gb-leaf${node.tone ? " " + node.tone : ""}${node.n ? " has-n" : ""}" style="flex:${node.size || 1} 1 0">${esc(node.label || "")}${node.n ? `<span class="gb-n">${node.n}</span>` : ""}</div>`;
}
function structureHTML(p, st) {
  const ref = shot(p.slug, st.screen);
  const wide = st.device !== "phone";
  const box = `<div class="gb ${wide ? "is-tablet" : "is-phone"} gb-node ${st.spec.dir === "col" ? "col" : "row"}" aria-hidden="true">${st.spec.children.map((c) => gbNode(c)).join("")}</div>`;
  return `<div class="structure${wide ? " is-wide" : ""}">
    <div class="structure-art${wide ? " is-wide" : ""}">
      ${box}
      ${ref ? `<div class="ref${wide ? " is-wide" : ""}">${device(st.device, p, st.screen)}</div>` : ""}
    </div>
    <div class="structure-legend">
      <h4>${esc(st.title)}</h4>
      <p class="cap" style="margin-top:0">Grey-box breakdown of the shipped screen, shown next to the real thing.</p>
      <ol class="legend-list">${st.legend.map((l, i) => `<li><span class="gb-n" aria-hidden="true">${i + 1}</span><span><b>${esc(l.t)}.</b> ${mark(l.d)}</span></li>`).join("")}</ol>
    </div>
  </div>`;
}

/* ---------- Iterations: before/after slider ---------- */
function compareHTML(p, it, i) {
  const b = shot(p.slug, it.before), a = shot(p.slug, it.after);
  if (!b || !a) return "";
  const phone = it.device === "phone";
  const ratio = phone ? `${a.w} / ${a.h}` : `${a.w} / ${Math.min(it.crop || a.h, a.h, b.h)}`;
  const id = `cmp-${p.slug}-${i}`;
  return `<div class="iter">
    <div class="iter-media${phone ? " is-phone" : ""}">
      <div class="cmp" style="aspect-ratio:${ratio};--pos:50%">
        ${imgTag(b)}
        <div class="cmp-after">${imgTag(a)}</div>
        <span class="cmp-line" aria-hidden="true"></span>
        <span class="cmp-handle" aria-hidden="true">${svg(`<path d="M9 6 3 12l6 6M15 6l6 6-6 6"/>`)}</span>
        <span class="cmp-tag b" aria-hidden="true">Before</span><span class="cmp-tag a" aria-hidden="true">After</span>
        <input type="range" min="0" max="100" value="50" step="1" id="${id}" aria-label="${esc(it.label)}: before and after. Lower values show more of the before version, higher values more of the after." aria-valuetext="50% before, 50% after" data-cmp>
      </div>
    </div>
    <div class="iter-text">
      <h4>${esc(it.label)}</h4>
      <p class="case-p">${mark(it.note)}</p>
      <p class="iter-hint">Drag the handle, or focus it and use the arrow keys.</p>
    </div>
  </div>`;
}

/* ---------- Gallery ---------- */
function galleryHTML(p) {
  const keys = p.gallery.filter((k) => shot(p.slug, k));
  if (!keys.length) return `<div class="soon-panel"><strong>Screens coming soon</strong><span>Final screens will appear here.</span></div>`;
  if (p.device === "phone") {
    return `<div class="gallery-phones" style="${tintStyle(p)}"><div class="stage-bg"></div>
      ${keys.map((k) => { const s = shot(p.slug, k), tall = s.h / s.w > SCREEN_ASPECT.phone * 1.12;
        return `<figure>${device("phone", p, k, { scroll: true })}<figcaption>${esc(caption(p.slug, k))}</figcaption>${tall ? `<span class="scroll-tip" aria-hidden="true">↕ Scroll inside</span>` : ""}</figure>`; }).join("")}
    </div>`;
  }
  if (p.device === "browser") {
    return `<div class="gallery-browser">${keys.map((k) => `<figure>${device("browser", p, k)}<figcaption>${esc(caption(p.slug, k))}</figcaption></figure>`).join("")}</div>`;
  }
  const first = shot(p.slug, keys[0]);
  return `<div class="gallery-tablet">
    <div class="viewer" style="${tintStyle(p)}"><div class="stage-bg"></div>
      <div class="device device--tablet"><div class="device-body"><div class="device-screen is-scroll" tabindex="0" role="region" aria-label="Selected screen, scrollable" data-viewer data-lenis-prevent>${imgTag(first)}</div></div></div>
      <p class="viewer-cap" aria-live="polite"><b data-viewer-cap>${esc(caption(p.slug, keys[0]))}</b><span class="scroll-tip" style="margin:0">↕ Scroll inside the screen</span></p>
    </div>
    <div class="thumbs" role="group" aria-label="Choose a screen">
      ${keys.map((k, i) => { const s = shot(p.slug, k); return `<button type="button" class="thumb" aria-pressed="${i === 0}" data-thumb="${k}"><img src="${s.src}" width="${s.w}" height="${s.h}" alt="" loading="lazy" decoding="async"><span>${esc(caption(p.slug, k))}</span></button>`; }).join("")}
    </div>
  </div>`;
}
function decisionMedia(p, d) {
  const keys = (d.screens || []).filter((k) => shot(p.slug, k));
  const kind = p.device;
  if (!keys.length && !d.plain) return `<div class="soon-panel"><strong>Screens coming soon</strong></div>`;
  const wide = kind !== "phone";
  const devs = (wide ? keys.slice(0, 2) : keys.slice(0, 3)).map((k) => device(kind, p, k)).join("");
  const plainImg = d.plain && shot(p.slug, d.plain) ? `<figure class="media-plain">${imgTag(shot(p.slug, d.plain))}</figure>` : "";
  const caps = keys.map((k) => caption(p.slug, k)).filter(Boolean).join(" · ");
  return `<div class="decision-media" style="${tintStyle(p)}"><div class="stage-bg"></div>
    <div class="media-row${keys.length === 1 && !wide ? " is-one" : ""}${wide ? " is-two-wide" : ""}">${devs}${plainImg}</div>
  </div>${caps ? `<p class="cap">${esc(caps)}</p>` : ""}`;
}

/* ---------- Case study ---------- */
const secHead = (n, label, title) => `<div class="case-sec-head"><span class="pill-label">${String(n).padStart(2, "0")} · ${esc(label)}</span><h3 class="case-sec-title">${esc(title)}</h3></div>`;
function caseHTML(p) {
  const idx = PROJECTS.indexOf(p), next = PROJECTS[(idx + 1) % PROJECTS.length];
  const rel = p.related && projectBySlug(p.related);
  let n = 0;
  const S = [];
  const ov = p.overview || {};
  const overview = `<dl class="overview">${[["Role", ov.role], ["Timeline", ov.timeline], ["Platform", ov.platform], ["Tools", ov.tools], ["Team", ov.team]].map(([k, v]) => `<div><dt>${k}</dt><dd>${mark(v || "[[PLACEHOLDER: " + k.toLowerCase() + "]]")}</dd></div>`).join("")}</dl>`;
  S.push(`<section class="case-sec" aria-label="Overview">${overview}</section>`);
  if (p.kind === "engineering") {
    S.push(`<section class="case-sec">${secHead(++n, "What it does", "A landing page that sells a marketplace")}<div class="case-body"><div>${p.does.map((t) => `<p class="case-p">${mark(t)}</p>`).join("")}</div></div></section>`);
    S.push(`<section class="case-sec">${secHead(++n, "Stack", "Read straight from the code")}<div class="case-body"><div><ul class="stack-chips">${p.stack.map((t) => `<li class="chip">${esc(t)}</li>`).join("")}</ul><p class="case-p" style="margin-top:1.25rem">${mark(p.stackNote)}</p></div></div></section>`);
    S.push(`<section class="case-sec">${secHead(++n, "Technical challenges", "Three problems, three fixes")}<div class="challenges">${p.challenges.map((c, i) => `
      <article class="challenge"><h4><span class="decision-n">${i + 1}</span>${esc(c.title)}</h4>
        <div class="ch-body"><p><span class="ch-k">Problem</span>${mark(c.problem)}</p><p><span class="ch-k">Solution</span>${mark(c.solution)}</p><p class="ch-refs">${esc(c.refs)}</p></div></article>`).join("")}</div></section>`);
    S.push(`<section class="case-sec">${secHead(++n, "Screenshots", "The site, section by section")}${galleryHTML(p)}<p class="cap">Captured at 1440 × 900 from a local build. The site isn't deployed yet.</p></section>`);
  } else {
    S.push(`<section class="case-sec">${secHead(++n, "The problem", "What it had to fix")}<div class="case-body"><div>${(p.problem.length ? p.problem : ["[[PLACEHOLDER: the problem]]"]).map((t) => `<p class="case-p">${mark(t)}</p>`).join("")}</div></div></section>`);
    S.push(`<section class="case-sec">${secHead(++n, "Key decisions", "Decisions that shaped it")}<div class="decisions">${p.decisions.map((d, i) => `
      <div class="decision"><div class="decision-text"><span class="decision-n">${i + 1}</span><h4 class="decision-title">${esc(d.title)}</h4><p class="case-p">${mark(d.body)}</p></div>
      <div class="decision-media-wrap">${decisionMedia(p, d)}</div></div>`).join("")}</div></section>`);
    if (p.flow) S.push(`<section class="case-sec">${secHead(++n, "How it works", p.flow.lanes.length > 1 ? "One order, four roles" : "The flow, end to end")}<div class="flow">${flowSVG(p.flow, `${plain(p.title)} user flow`, false)}${flowSVG(p.flow, `${plain(p.title)} user flow`, true)}${flowText(p.flow)}</div><p class="cap flow-note">${mark(p.flow.note)}</p></section>`);
    if (p.structure.length || p.midfi) S.push(`<section class="case-sec">${secHead(++n, "Structure", "How the key screens are built")}${p.structure.map((st) => structureHTML(p, st)).join("")}
      ${p.midfi ? `<div class="iter-extra"><div class="media-row" style="padding:2rem 1rem;border-radius:1.75rem;background:var(--surface-2)">${p.midfi.screens.map((k) => device("phone", p, k)).join("")}</div><p class="case-p">${mark(p.midfi.caption)}</p></div>` : ""}</section>`);
    if (p.iterations.length) S.push(`<section class="case-sec">${secHead(++n, "Iterations", "Version one, version two")}<div class="iters">${p.iterations.map((it, i) => compareHTML(p, it, i)).join("")}</div>
      ${p.iterationExtra && shot(p.slug, p.iterationExtra.screen) ? `<div class="iter-extra"><img src="${shot(p.slug, p.iterationExtra.screen).src}" width="${shot(p.slug, p.iterationExtra.screen).w}" height="${shot(p.slug, p.iterationExtra.screen).h}" alt="${esc(shot(p.slug, p.iterationExtra.screen).alt)}" loading="lazy" decoding="async"><p class="case-p">${mark(p.iterationExtra.caption)}</p></div>` : ""}</section>`);
    S.push(`<section class="case-sec">${secHead(++n, "Final screens", "The shipped screens")}${galleryHTML(p)}</section>`);
    if (p.style) {
      const sheet = p.style.sheet && shot(p.slug, p.style.sheet);
      S.push(`<section class="case-sec">${secHead(++n, "Style guide", "Colour and type")}
        ${sheet ? `<figure class="style-sheet">${imgTag(sheet)}</figure>` : ""}
        <ul class="swatches">${p.style.swatches.map(([name, hex]) => `<li class="swatch"><i style="background:${hex}"></i><b>${esc(name)}</b><code>${hex}</code></li>`).join("")}</ul>

    }
    if (p.howBuilt) S.push(`<section class="case-sec"><div class="built"><span class="pill-label" style="border-color:rgb(255 255 255/.4);color:#fff;justify-self:start">${String(++n).padStart(2, "0")} · How I built it</span><h3 class="case-sec-title">${esc(p.howBuiltTitle || "Designed it, then built it")}</h3><p>${mark(p.howBuilt)}</p></div></section>`);
  }
  S.push(`<section class="case-sec">${secHead(++n, "What I learned", "Takeaways")}<div class="case-body"><ul class="learned">${(p.learned.length ? p.learned : ["[[DRAFT: what I learned]]"]).map((t) => `<li>${mark(t)}</li>`).join("")}</ul></div></section>`);
  return `
  <div class="case-bar"><div class="case-bar-inner">
    <p class="case-crumb"><span class="n">${String(idx + 1).padStart(2, "0")} / ${String(PROJECTS.length).padStart(2, "0")}</span><span class="t">Case study · ${esc(p.title)}</span></p>
    <button type="button" class="case-close" data-case-close aria-label="Close case study">${I.x()}<span>Close</span><kbd>Esc</kbd></button>
  </div></div>
  <article class="case" style="${tintStyle(p)}">
    <div class="case-shell">
      <header class="case-hero">
        <div class="case-hero-text" data-case-fade>
          <p class="work-context">${contextLine(p)}</p>
          <h2 class="case-h1" id="case-title">${esc(p.title)}</h2>
          <p class="case-lede">${mark(p.summary)}</p>
        </div>
        <div class="case-hero-meta" data-case-fade>
          <p class="work-role"><b>Role</b> · ${mark(p.role)}</p>
          <ul class="work-tags" aria-label="Tags">${p.tags.map((t) => `<li class="chip">${esc(t)}</li>`).join("")}</ul>
          ${p.built ? badgeHTML() : ""}
        </div>
      </header>
      <div class="case-hero-stage">${stage(p, { lazy: false })}</div>
      <div data-case-fade>${S.join("")}
        <nav class="case-next" aria-label="More case studies">
          ${rel ? `<a class="next-card is-light" href="#work/${rel.slug}"><span class="k">Related · ${esc(p.relatedLabel || "")}</span><span class="t">${esc(rel.title)}</span><span class="arrow">${I.arrowRight("")}</span></a>` : ""}
          <a class="next-card" href="#work/${next.slug}"${rel ? "" : ' style="grid-column:1 / -1"'}><span class="k">Next project</span><span class="t">${esc(next.title)}</span><span class="arrow">${I.arrowRight("")}</span></a>
        </nav>
      </div>
    </div>
  </article>`;
}

/* ============================================================
   Generic carousel (HeroCard and testimonials)
   ============================================================ */
function carousel(root, { auto = false } = {}) {
  const slides = $$("[data-slide]", root);
  const dots = $$("[data-dot]", root);
  let i = 0, timer = null, paused = false, inView = true;
  const setDots = () => dots.forEach((d, k) => d.querySelector(".dot").classList.toggle("is-active", k === i));
  function show(n, dir = 1) {
    const len = slides.length;
    const next = ((n % len) + len) % len;
    if (next === i) return;
    const from = slides[i], to = slides[next];
    i = next;
    from.hidden = true;
    to.hidden = false;
    setDots();
    if (!reduce) gsap.fromTo(to, { opacity: 0, y: 14 * dir }, { opacity: 1, y: 0, duration: .45, ease: "power3.out" });
  }
  function schedule() {
    clearTimeout(timer);
    if (!auto || paused || !inView || reduce) return;
    timer = setTimeout(() => { show(i + 1); schedule(); }, 4000);
  }
  $("[data-next]", root)?.addEventListener("click", (e) => { e.stopPropagation(); show(i + 1, 1); schedule(); });
  $("[data-prev]", root)?.addEventListener("click", (e) => { e.stopPropagation(); show(i - 1, -1); schedule(); });
  dots.forEach((d, k) => d.addEventListener("click", (e) => { e.stopPropagation(); show(k, k > i ? 1 : -1); schedule(); }));
  if (auto) {
    root.addEventListener("click", (e) => { if (!e.target.closest("button")) { show(i + 1); schedule(); } });
    root.addEventListener("mouseenter", () => { paused = true; schedule(); });
    root.addEventListener("mouseleave", () => { paused = false; schedule(); });
    root.addEventListener("focusin", () => { paused = true; schedule(); });
    root.addEventListener("focusout", () => { paused = false; schedule(); });
    new IntersectionObserver(([en]) => { inView = en.isIntersecting; schedule(); }).observe(root);
  }
  slides.forEach((s, k) => { s.hidden = k !== 0; });
  setDots();
  schedule();
  return { show, schedule };
}
carousel($("#testimonials"));

/* ============================================================
   Hero halftone: you as fine blue dots + a faint dot field. The cursor pushes the dots away
   (they scatter, then spring back); a click blows a bigger burst. One WebGL2 shader, photo uploaded once.
   No WebGL2: the colour photo shows instead.
   ============================================================ */
const hero = $("#home");
const subject = $("#subject");
const subjectInner = $("#subject-inner");
const photo = $("#photo");
const htCanvas = $("#halftone");
let heroInView = true;

const HT = {
  cell: 5,                                   /* px between dot centres */
  cursor: { push: 42, radius: 80 },          /* px the nearest dots are pushed; falloff radius (keep push < 1.6 × radius) */
  burst: { push: 95, radius: 150 },          /* click / tap */
  follow: 14,                                /* how quickly the push centre follows the cursor (higher = tighter) */
  spring: { k: 120, damping: 11 },           /* push strength spring: slight overshoot on release */
  jitter: .9,                                /* scatter noise, in cells, at full push */
  life: { twirl: .22, twirlSpeed: .9, orbit: .8, breathe: .15, reach: 1.5 },
  /* "life" around the cursor: twirl = max sway angle (rad), orbit = per-dot circling radius (cells),
     breathe = push pulse (±15%), reach = how far the motion extends (× cursor.radius) */
  color: [0 / 255, 71 / 255, 204 / 255], deep: [10 / 255, 47 / 255, 128 / 255], light: [79 / 255, 148 / 255, 247 / 255]
};
const ht = {
  gl: null, ok: false, running: false, intro: 0,
  c: { x: -9999, y: -9999, tx: -9999, ty: -9999, a: 0, v: 0, target: 0 },  /* cursor field */
  b: { x: 0, y: 0, a: 0 },                                                    /* burst field */
  lastActive: 0
};

/* Subject box: from lg, right 4%, height 84%; below lg, 62%, centred. Its bottom sits on the status bar's
   top edge, so the status text never lands on the dark shirt dots. */
function layoutSubject() {
  const W = hero.getBoundingClientRect().width;
  const content = $(".hero-content"), status = $(".hero-status");
  /* Below lg the portrait stacks under the text: reserve room for it so it never sits behind the copy. */
  const small = W < 1024;
  const hSmall = Math.min(W * 0.92, innerHeight * 0.6);
  content.style.paddingBottom = small ? Math.round(hSmall * 0.9) + "px" : "";
  const H = hero.getBoundingClientRect().height;
  const floor = status ? status.offsetTop : H;
  let h, left;
  if (!small) {
    /* Large: the head tops out just under the floating header, the photo's empty bottom 5% tucks under the
       status line, and the box hugs the right edge. */
    const hb = $("#header").getBoundingClientRect().bottom - hero.getBoundingClientRect().top;
    const ceil = Math.max(hb + 12, 0.06 * H);
    h = Math.min((floor - ceil) / 0.9, W * 0.62);
    left = W * 1.01 - h;
    Object.assign(subject.style, { left: left + "px", top: (floor + 0.05 * h - h) + "px", width: h + "px", height: h + "px" });
    return;
  }
  h = hSmall; left = (W - h) / 2;
  Object.assign(subject.style, { left: left + "px", top: (floor - h) + "px", width: h + "px", height: h + "px" });
}

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uPhoto;
uniform vec2 uRes; uniform float uDpr, uCell, uLod, uIntro, uJitter;
uniform float uTime, uAmt, uTwirl, uOrbit, uReach;   /* life around the cursor; uAmt = cursor strength 0..1 */
uniform vec3 uSubj;                 /* x, y, size of the subject box (px, hero space) */
uniform vec4 uF0, uF1;              /* push fields: x, y, push px (already scaled by strength), radius px */
uniform vec3 uCol, uDeep, uLight;
out vec4 o;

vec2 field(vec2 q, vec4 F) {
  vec2 d = q - F.xy; float r = length(d);
  if (F.z <= .01 || r < 1e-3) return vec2(0.);
  return d / r * F.z * exp(-r * r / (2. * F.w * F.w));
}
/* the cursor's area sways in a slow twist (small angles so the inverse below stays stable) */
vec2 twirl(vec2 q) {
  vec2 d = q - uF0.xy; float R = uF0.w * uReach;
  float ang = uTwirl * uAmt * sin(uTime * ${HT.life.twirlSpeed.toFixed(3)}) * exp(-dot(d, d) / (2. * R * R));
  float cs = cos(ang), sn = sin(ang);
  return vec2(cs * d.x - sn * d.y, sn * d.x + cs * d.y) - d;
}
vec2 disp(vec2 q) { return field(q, uF0) + field(q, uF1) + twirl(q); }
float hash(vec2 c) { return fract(sin(dot(c, vec2(127.1, 311.7))) * 43758.5453); }

void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uDpr - gl_FragCoord.y) / uDpr;
  float hc = uCell * .5;
  /* where did the dot now covering p come from? fixed-point inverse of q + disp(q) = p */
  vec2 q = p;
  for (int i = 0; i < 4; i++) q = p - disp(q);
  vec2 base = floor(q / uCell);
  vec2 sc = uSubj.xy + uSubj.z * vec2(.5, .42);
  float best = 0.; vec3 bestCol = vec3(0.);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 cell = base + vec2(float(i), float(j));
    vec2 c = (cell + .5) * uCell;
    /* dot size from the photo (subject) or the faint field */
    vec2 uv = (c - uSubj.xy) / uSubj.z;
    vec4 s = (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) ? vec4(0.) : textureLod(uPhoto, uv, uLod);
    float a = s.a;
    vec3 rgb = a > .001 ? s.rgb / a : vec3(1.);
    float dark = clamp((1. - dot(rgb, vec3(.299, .587, .114))) * 1.08, 0., 1.);
    float rSub = hc * sqrt(mix(.06, 1., dark)) * smoothstep(.15, .6, a);
    float near = smoothstep(uSubj.z * 1.05, uSubj.z * .2, distance(c, sc));
    float rField = hc * (.12 + .24 * near);
    bool isSub = rSub > .001 && rSub >= rField;
    float r = isSub ? rSub : rField;
    /* intro: dots grow in as a wave from the bottom */
    float wave = clamp((uIntro * (uRes.y + 360.) - (uRes.y - c.y)) / 360., 0., 1.);
    r *= wave * wave * (3. - 2. * wave);
    /* pushed position + scatter jitter that grows with the push; pushed dots shrink a little */
    vec2 dv = disp(c);
    float k = clamp(length(dv) / 40., 0., 1.);
    vec2 jit = (vec2(hash(cell), hash(cell + 17.3)) - .5) * 2. * uJitter * uCell * k;
    /* each dot near the cursor circles its spot with its own phase and speed */
    vec2 dc = c - uF0.xy; float R = uF0.w * uReach;
    float life = uAmt * exp(-dot(dc, dc) / (2. * R * R));
    float ph = hash(cell + 3.1) * 6.2832, sp = 1.4 + 2.2 * hash(cell + 9.7);
    vec2 orb = vec2(cos(uTime * sp + ph), sin(uTime * sp * .83 + ph)) * uOrbit * uCell * life;
    vec2 cd = c + dv + jit + orb;
    r *= 1. - .35 * k;
    float d = distance(p, cd);
    float m = 1. - smoothstep(r - .6, r + .6, d);
    if (!isSub) m *= .38 + .4 * near + .3 * k;
    if (m > best) { best = m; bestCol = isSub ? mix(uCol, uDeep, smoothstep(.55, 1., dark)) : uLight; }
  }
  o = vec4(bestCol * best, best);
}`;

function htInit() {
  const gl = htCanvas.getContext("webgl2", { premultipliedAlpha: true, antialias: false, alpha: true });
  if (!gl) { info("WebGL2 unavailable: hero shows the colour photo"); return false; }
  const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  try {
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    /* photo → 512² texture with mipmaps (each dot averages its cell) */
    const comp = document.createElement("canvas");
    comp.width = comp.height = 512;
    comp.getContext("2d").drawImage(photo, 0, 0, 512, 512);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, comp);
    gl.generateMipmap(gl.TEXTURE_2D);
    const u = {};
    for (const n of ["uPhoto", "uRes", "uDpr", "uCell", "uLod", "uIntro", "uJitter", "uSubj", "uF0", "uF1", "uCol", "uDeep", "uLight",
      "uTime", "uAmt", "uTwirl", "uOrbit", "uReach"])
      u[n] = gl.getUniformLocation(prog, n);
    gl.uniform1i(u.uPhoto, 0); gl.uniform1f(u.uCell, HT.cell); gl.uniform1f(u.uJitter, HT.jitter);
    gl.uniform1f(u.uTwirl, HT.life.twirl); gl.uniform1f(u.uOrbit, HT.life.orbit); gl.uniform1f(u.uReach, HT.life.reach);
    gl.uniform3fv(u.uCol, HT.color); gl.uniform3fv(u.uDeep, HT.deep); gl.uniform3fv(u.uLight, HT.light);
    gl.clearColor(0, 0, 0, 0);
    Object.assign(ht, { gl, u, ok: true });
    if (!ht.listening) {
      ht.listening = true;
      htCanvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); htSleep(); ht.ok = false; hero.classList.remove("has-halftone"); });
      htCanvas.addEventListener("webglcontextrestored", () => { if (htInit()) { ht.intro = 1; hero.classList.add("has-halftone"); htResize(); } });
    }
    return true;
  } catch (e) { info("halftone shader failed: " + e.message); return false; }
}

function htResize() {
  if (!ht.ok) return;
  /* 9 dot lookups per pixel: cap the backing resolution at 1.5× to keep it light on laptops */
  const r = hero.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 1.5);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (htCanvas.width !== w || htCanvas.height !== h) { htCanvas.width = w; htCanvas.height = h; }
  Object.assign(ht, { dpr, W: r.width, H: r.height });
  htWake();
}

function htFrame(_, dtMs = 16) {
  if (!ht.ok) return;
  const now = performance.now(), dt = Math.min(dtMs / 1000, 1 / 30), c = ht.c;
  /* push centre trails the cursor; push strength rides a spring (dots overshoot slightly coming back) */
  const f = 1 - Math.exp(-dt * HT.follow);
  c.x += (c.tx - c.x) * f; c.y += (c.ty - c.y) * f;
  c.v += (HT.spring.k * (c.target - c.a) - HT.spring.damping * c.v) * dt;
  c.a += c.v * dt;
  const hr = hero.getBoundingClientRect(), ir = subjectInner.getBoundingClientRect();
  const gl = ht.gl, u = ht.u;
  gl.viewport(0, 0, htCanvas.width, htCanvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(u.uRes, ht.W, ht.H); gl.uniform1f(u.uDpr, ht.dpr);
  gl.uniform1f(u.uLod, Math.max(0, Math.log2(HT.cell * 512 / Math.max(ir.width, 1))));
  gl.uniform3f(u.uSubj, ir.left - hr.left, ir.top - hr.top, ir.width);
  const t = now / 1000, amt = Math.max(c.a, 0);
  gl.uniform1f(u.uTime, t); gl.uniform1f(u.uAmt, Math.min(amt, 1.2));
  gl.uniform4f(u.uF0, c.x, c.y, HT.cursor.push * amt * (1 + HT.life.breathe * Math.sin(t * 2.1)), HT.cursor.radius);
  gl.uniform4f(u.uF1, ht.b.x, ht.b.y, HT.burst.push * Math.max(ht.b.a, 0), HT.burst.radius);
  gl.uniform1f(u.uIntro, ht.intro);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  /* keep animating while the cursor is in the hero: the dots around it never stand still */
  const busy = c.a > .002 || Math.abs(c.target - c.a) > .002 || Math.abs(c.v) > .002 || Math.hypot(c.tx - c.x, c.ty - c.y) > .3 || ht.b.a > .002;
  if (busy) ht.lastActive = now;
  if (now - ht.lastActive > 300) htSleep();
}
function htWake() {
  if (!ht.ok) return;
  ht.lastActive = performance.now();
  if (reduce) { htFrame(); return; }
  if (ht.running || !heroInView) return;
  ht.running = true; gsap.ticker.add(htFrame);
}
function htSleep() { if (!ht.running) return; ht.running = false; gsap.ticker.remove(htFrame); }
/* Tab hidden: stop. Back: one fresh frame so the dots match the current scroll and size. */
document.addEventListener("visibilitychange", () => { if (document.hidden) htSleep(); else htWake(); });

function htLocal(e) { const hr = hero.getBoundingClientRect(); return { x: e.clientX - hr.left, y: e.clientY - hr.top }; }
if (!reduce) {
  /* cursor over the hero pushes the dots away; leaving lets them spring back */
  hero.addEventListener("pointermove", (e) => {
    if (!ht.ok || e.pointerType !== "mouse") return;
    const { x, y } = htLocal(e), c = ht.c;
    if (c.target === 0 && c.a < .01) { c.x = x; c.y = y; }   /* fresh entry: start the push where the cursor is */
    c.tx = x; c.ty = y; c.target = 1;
    htWake();
  }, { passive: true });
  hero.addEventListener("pointerleave", () => { ht.c.target = 0; htWake(); });
  /* click / tap: a bigger burst that blows the dots out, then springs back */
  hero.addEventListener("pointerdown", (e) => {
    if (!ht.ok) return;
    const { x, y } = htLocal(e);
    gsap.killTweensOf(ht.b);
    Object.assign(ht.b, { x, y });
    gsap.timeline({ onUpdate: htWake })
      .to(ht.b, { a: 1, duration: .14, ease: "power2.out" })
      .to(ht.b, { a: 0, duration: 1.1, ease: "elastic.out(1, .5)" });
  }, { passive: true });
}

/* Entrance: dots grow in as a wave from the bottom. */

    .fromTo("[data-hero='h1'] .inner", { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: .9, stagger: .12, ease: "expo.out" }, .25)
    .fromTo("[data-hero='intro']", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .8, ease: "power3.out" }, .6)

/* ============================================================
   Loader: 0 → 90 over 1.3s, hold for the photo, 90 → 100, slide up
   ============================================================ */
function runLoader(heroReadyP) {
  const loader = $("#loader");
  const fill = $("#loader-fill");
  const count = $("#loader-count");
  $("#loader-brand").innerHTML = `${I.logo()}<span>${esc(CONTENT.loaderName)}</span>`;
  $("#loader-tag").textContent = CONTENT.loaderTagline;
  stopScroll();
  const setP = (p) => {
    gsap.set(fill, { scaleX: p / 100 });
    count.textContent = String(Math.round(p)).padStart(3, "0");
  };
  const finish = () => {
    gsap.to("#loader-center", { opacity: 0, y: -12, duration: .5, ease: "power2.out" });
    gsap.to(loader, {
      yPercent: -100, duration: .7, ease: "expo.out", delay: .05,
      onComplete() {
        startScroll();
        loader.remove();
        window.__ready = true;
        window.dispatchEvent(new Event("ready"));
      }
    });
  };
  if (reduce) { setP(100); finish(); return; }
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const o = { v: 0 };
  gsap.to(o, {
    v: 90, duration: 1.3, ease,
    onUpdate: () => setP(o.v),
    onComplete() {
      heroReadyP.then(() => {
        gsap.to(o, { v: 100, duration: .25, ease: "none", onUpdate: () => setP(o.v), onComplete: finish });
      });
    }
  });
}

/* ============================================================
   Section tracking for header aria-current
   ============================================================ */
function setupNavTracking() {
  /* One active section at a time; leaving a section only clears it if it is still the active one,
     so two triggers toggling in the same frame can't leave every link unlit. */
  let active = null;
  const MENU_LABEL = { works: "Work", about: "About", skills: "Stack", contact: "Contact" };
  const paint = () => {
    $$("[data-nav]").forEach((a) => a.setAttribute("aria-current", String(a.dataset.nav === active)));
    $$("[data-menu-item]").forEach((b) => b.setAttribute("aria-current", String(MENU_LABEL[active] === b.dataset.menuItem)));
  };
  const track = (id, start, end) => ScrollTrigger.create({
    trigger: `#${id}`, start, end,
    onToggle: (self) => { if (self.isActive) active = id; else if (active === id) active = null; paint(); }
  });
  ["works", "about", "skills", "manifesto"].forEach((id) => track(id, "top 45%", "bottom 45%"));
  /* Footer is the last thing on the page, so it may never reach 45%: light Contact as soon as it is well in view. */
  track("contact", "top 75%", "bottom top");
}
/* Hero in view → the dots run; out of view → they sleep. An IntersectionObserver, not a ScrollTrigger: the hero
   starts at scroll 0, and a trigger starting there reads "inactive" once you scroll back to the very top. */
new IntersectionObserver(([en]) => {
  heroInView = en.isIntersecting;
  if (heroInView) { htResize(); htWake(); } else htSleep();
}).observe(hero);

function trapFocus(container, e) {
  if (e.key !== "Tab") return;
  const f = $$("button, a[href], input, textarea, [tabindex='0']", container).filter((el) => !el.disabled && el.getClientRects().length);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
